[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ebook-reader"
version = "0.1.0"
description = "A small native GTK 4 PDF ebook reader"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Matthew McWilliams"},
]
dependencies = []

[project.scripts]
ebook-reader = "ebook_reader.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
